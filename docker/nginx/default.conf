server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 50M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        # Required for the SSE-streamed AI chat responses (routes/web.php "ai." group) —
        # without this nginx buffers the whole FastCGI response before sending it,
        # which defeats token-by-token streaming. Negligible cost for normal requests.
        fastcgi_buffering off;
        proxy_buffering off;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|woff|woff2|ttf)$ {
        try_files $uri $uri/ /index.php?$query_string;
        expires 7d;
        access_log off;
    }
}
